syntax = "proto3";
package server_status;

message IpInfo {
  string query = 1;
  string source = 2; // ip-api,
  //
  string continent = 3;
  string country = 4;
  string region_name = 5;
  string city = 6;
  //
  string isp = 7;
  string org = 8;
  string as = 9;
  string asname = 10;
  //
  double lat = 11;
  double lon = 12;

  string timezone = 13;
}

message SysInfo {
  string name = 1;
  string version = 2;

  string os_name = 3;
  string os_arch = 4;
  string os_family = 5;
  string os_release = 6;
  string kernel_version = 7;

  uint32 cpu_num = 8;
  string cpu_brand = 9;
  string cpu_vender_id = 10;

  string host_name = 11;
}

message DiskInfo {
  string name = 1;
  string mount_point = 2;
  string file_system = 3;
  uint64 total = 4;
  uint64 used = 5;
  uint64 free = 6;
}

message StatRequest {
  string name = 1;
  string version = 2;
  uint64 latest_ts = 3;
  string frame = 4;

  bool vnstat = 6;

  bool online4 = 7;
  bool online6 = 8;

  uint64 uptime = 9;
  // load
  double load_1 = 10;
  double load_5 = 11;
  double load_15 = 12;

  //
  double ping_10010 = 13;
  double ping_189 = 14;
  double ping_10086 = 15;
  double time_10010 = 16;
  double time_189 = 17;
  double time_10086 = 18;

  // t/u/p/d
  uint32 tcp = 19;
  uint32 udp = 20;
  uint32 process = 21;
  uint32 thread = 22;

  // netowrk
  uint64 network_rx = 23;
  uint64 network_tx = 24;
  uint64 network_in = 25;
  uint64 network_out = 26;

  uint64 last_network_in = 27;
  uint64 last_network_out = 28;

  //
  double cpu = 29;
  uint64 memory_total = 30;
  uint64 memory_used = 31;
  uint64 swap_total = 32;
  uint64 swap_used = 33;
  uint64 hdd_total = 34;
  uint64 hdd_used = 35;

  optional string custom = 36;

  optional SysInfo sys_info = 37;
  optional IpInfo ip_info = 38;

  // group
  string gid = 39;
  string alias = 40;
  uint64 weight = 41;

  string type = 42;
  string location = 43;
  bool notify = 44;
  // false: KiB (1024), true: KB (1000)
  bool si = 45;
  repeated DiskInfo disks = 46;
  // Fork extension: stable boot identifier, e.g. "<boot_epoch>/<iface_digest>".
  // Empty means "unknown" (old / python clients): the server then falls back
  // to its legacy baseline accounting instead of accumulate().
  string boot_id = 47;

  // Fork extension: IPv6 three-carrier probe results, same carriers as
  // fields 13-18 (loss % / latency ms). Zero means "not probed": no v6
  // address configured, or an old client that does not report v6.
  double ping_10010_v6 = 48;
  double ping_189_v6 = 49;
  double ping_10086_v6 = 50;
  double time_10010_v6 = 51;
  double time_189_v6 = 52;
  double time_10086_v6 = 53;

  // Fork extension: client auto-detection (see stats.rs precedence).
  // These are detected values, NOT explicit ones: the server only uses
  // them when neither an explicit client value nor a backend host value
  // exists, so explicit settings always win.
  string location_detected = 54;
  string type_detected = 55;
}

message Response {
  int32 code = 1;
  string message = 2;
  // Fork extension: server-managed three-carrier probe settings, pushed to
  // the client on every report. Empty addresses mean "keep client args".
  bool ping_enabled = 3;
  string ping_cu = 4;
  string ping_ct = 5;
  string ping_cm = 6;
  // Fork extension: IPv6 probes, same three carriers. Old clients ignore
  // unknown fields; empty means "do not probe v6 for that carrier".
  string ping_cu_v6 = 7;
  string ping_ct_v6 = 8;
  string ping_cm_v6 = 9;
  // Fork extension: true when the server manages probes (this fork always
  // sends it). Old servers never send it, so a client can tell "server
  // sent an explicit probe config, possibly all empty" apart from "old
  // server, keep CLI defaults": only the latter keeps CLI behavior.
  bool ping_managed = 10;
}

service ServerStatus { rpc Report(StatRequest) returns (Response); }