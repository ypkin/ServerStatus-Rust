# Nginx vhost for ssr.passall.us on haruka (copy to /home/web/conf.d/ and
# reload the host-network nginx container). Cert paths below assume the
# host /home/web/certs is mounted at the same path inside the container;
# VERIFY with `docker inspect nginx` at deploy time and adjust if the
# mount maps elsewhere (other hosts map it to /etc/nginx/certs).
# Obtain the cert first (certbot DNS-01) after the DNS A record resolves.
# 8080 stays loopback-only on purpose.
upstream ssr_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name ssr.passall.us;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name ssr.passall.us;

    ssl_certificate /home/web/certs/ssr.passall.us.crt;
    ssl_certificate_key /home/web/certs/ssr.passall.us.key;

    location / {
        proxy_pass http://ssr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
