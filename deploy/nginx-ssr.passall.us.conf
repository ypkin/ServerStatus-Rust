# Nginx vhost for ssr.passall.us on haruka (copy to /home/web/conf.d/ and
# reload the host-network nginx container).
# Cert paths are INSIDE the container: haruka mounts host /home/web/certs
# at /etc/nginx/certs, and files follow the existing
# <domain>_cert.pem / <domain>_key.pem naming (see nezha vhost).
# The cert itself is issued on exact-de (certbot DNS-01) and copied here;
# see the renewal note in the deploy summary: renewal on exact-de does
# NOT auto-sync to haruka yet.
# 8080 stays loopback-only on purpose.
upstream ssr_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name ssr.passall.us;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name ssr.passall.us;

    ssl_certificate /etc/nginx/certs/ssr.passall.us_cert.pem;
    ssl_certificate_key /etc/nginx/certs/ssr.passall.us_key.pem;

    location / {
        proxy_pass http://ssr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
