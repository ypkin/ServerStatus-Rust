# SSR panel config for haruka (copy to ./data/config.toml at deploy time).
# Nodes and groups are managed in the /admin panel afterwards, so hosts
# and hosts_group start empty here.
grpc_addr = "0.0.0.0:9394"
http_addr = "0.0.0.0:8080"
offline_threshold = 30
grpc_tls = 0
tls_dir = "tls"
workspace = "/data"

# Admin login for /admin and /detail. Deploy step replaces the placeholders
# with a generated password and reports it once; change it here any time.
admin_user = "__ADMIN_USER__"
admin_pass = "__ADMIN_PASS__"

# Public report URL: agents use https://ssr.passall.us/report, and the
# panel derives one-click install links from this origin.
server_url = "https://ssr.passall.us/report"

hosts = []
hosts_group = []
group_gc = 30
notify_interval = 30

# Three-carrier probes (panel-overridable at runtime, see /admin).
[ping]
enabled = true
cu_addr = "cu.tz.cloudcpp.com:80"
ct_addr = "ct.tz.cloudcpp.com:80"
cm_addr = "cm.tz.cloudcpp.com:80"

# PushPlus offline alerts: disabled until the panel owner enables it in
# /admin with their own token (token is never returned by any API).
[pushplus]
enabled = false
token = ""
title = "ServerStatus"
channel = "wechat"
online_tpl = ""
offline_tpl = ""
custom_tpl = ""
traffic_tpl = ""
