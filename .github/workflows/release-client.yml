name: Release client

# 预编译 musl 客户端：打 client-v* 标签即自动构建并发布到 GitHub Release。
# README 第 6 节的下载链接指向这里的 Release 产物。

on:
  push:
    tags:
      - "client-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. client-v1 (must be new)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools (musl-gcc)
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build musl client
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl -p stat_client

      - name: Verify statically linked
        run: |
          file target/x86_64-unknown-linux-musl/release/stat_client
          file target/x86_64-unknown-linux-musl/release/stat_client | grep -qE "statically linked|static-pie linked"

      - name: Create Release and upload client
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: |
            预编译 musl 客户端（x86_64 静态版，glibc 机器与 Alpine 通用）。

            安装：
            ```bash
            mkdir -p /opt/ServerStatus
            # 下载 stat_client 到 /opt/ServerStatus/（见本页 Assets）
            chmod +x /opt/ServerStatus/stat_client
            ```
            然后按 README 第 6 节配 systemd 或 OpenRC（只改 ExecStart / command_args 一行）。
          files: target/x86_64-unknown-linux-musl/release/stat_client
